[package]
name = "sozu-prometheus-connector"
description = "This application retrieve internals metrics of Sōzu and format them into prometheus"
homepage = "https://github.com/CleverCloud/sozu-prometheus-connector"
documentation = "https://github.com/CleverCloud/sozu-prometheus-connector/blob/main/README.md"
version = "0.4.0"
rust-version = "1.93.1"
edition = "2024"
license-file = "LICENSE"
authors = ["Emmanuel Bosquet <emmanuel.bosquet@clever-cloud.com>", "Florentin Dubois <florentin.dubois@clever-cloud.com>"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "^0.8.9", features = ["tokio"] }
config = "^0.15.27"
clap = { version = "^4.6.7", features = ["derive"] }
mime = "^0.3.17"
paw = "^1.0.0"
prometheus = "^0.14.0"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
sentry = { version = "^0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "^0.49.3"
sozu-client = "^0.6.0"
sozu-command-lib = "^2.3.0"
thiserror = "^2.0.21"
tokio = { version = "^1.53.3", features = ["macros", "rt", "signal"] }
tracing = "^0.1.44"
tracing-subscriber = "^0.3.23"
urlencoding = "^2.1.3"
